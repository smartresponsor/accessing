parameters:
  accessing.product_name: 'Accessing'
  accessing.mailer_sender.default: 'no-reply@accessing.local'
  accessing.phone_verification_provider.default: 'fake'
  accessing.phone_verification_provider: '%env(default:accessing.phone_verification_provider.default:ACCESSING_PHONE_VERIFICATION_PROVIDER)%'

services:
  _defaults:
    autowire: true
    autoconfigure: true
    bind:
      $appSecret: '%env(APP_SECRET)%'
      $accessingSessionMaxIdleDays: 30
      $accessingVerificationCodeTtlMinutes: 15
      $accessingRecoveryCodeTtlMinutes: 30
      $accessingAccountLockThreshold: 5
      $accessingAccountLockMinutes: 15
      $accessingProductName: '%accessing.product_name%'
      $accessingMailerSender: '%env(default:accessing.mailer_sender.default:ACCESSING_MAILER_SENDER)%'
      Symfony\Component\RateLimiter\RateLimiterFactory $accessingSignInLimiter: '@limiter.accessing_sign_in'
      Symfony\Component\RateLimiter\RateLimiterFactory $accessingSignUpLimiter: '@limiter.accessing_sign_up'
      Symfony\Component\RateLimiter\RateLimiterFactory $accessingRecoveryLimiter: '@limiter.accessing_recovery'
      Symfony\Component\RateLimiter\RateLimiterFactory $accessingForgotPasswordLimiter: '@limiter.accessing_forgot_password'
      Symfony\Component\RateLimiter\RateLimiterFactory $accessingVerificationResendLimiter: '@limiter.accessing_verification_resend'

  _instanceof:
    App\Administering\ServiceInterface\Config\AdministrationConfigToolServiceInterface:
      tags: ['administering.config_tool']

  App\Accessing\:
    resource: '../src/'
    exclude:
      - '../src/DependencyInjection/'
      - '../src/Entity/'
      - '../src/Command/AccessingDemoResetCommand.php'
      - '../src/Kernel.php'

  App\Accessing\ServiceInterface\AccountContext\AccessingCurrentAccountContextProviderInterface: '@App\Accessing\Service\AccountContext\AccessingCurrentAccountContextProvider'
  App\Accessing\ServiceInterface\Account\AccessingAccountAuthenticationServiceInterface: '@App\Accessing\Service\Account\AccessingAccountAuthenticationService'
  App\Accessing\ServiceInterface\Account\AccessingAccountRegistrationServiceInterface: '@App\Accessing\Service\Account\AccessingAccountRegistrationService'
  App\Accessing\ServiceInterface\AccountSession\AccessingAccountSessionServiceInterface: '@App\Accessing\Service\AccountSession\AccessingAccountSessionService'
  App\Accessing\ServiceInterface\Credential\AccessingCredentialServiceInterface: '@App\Accessing\Service\Credential\AccessingCredentialService'
  App\Accessing\ServiceInterface\Recovery\AccessingRecoveryServiceInterface: '@App\Accessing\Service\Recovery\AccessingRecoveryService'
  App\Accessing\ServiceInterface\SecondFactor\AccessingSecondFactorServiceInterface: '@App\Accessing\Service\SecondFactor\AccessingSecondFactorService'
  App\Accessing\ServiceInterface\SecurityEvent\AccessingSecurityEventRecorderInterface: '@App\Accessing\Service\SecurityEvent\AccessingSecurityEventRecorder'
  App\Accessing\ServiceInterface\SecurityEvent\AccessingSecurityEventServiceInterface: '@App\Accessing\Service\SecurityEvent\AccessingSecurityEventService'
  App\Accessing\ServiceInterface\SecurityNotification\AccessingSecurityNotificationServiceInterface: '@App\Accessing\Service\SecurityNotification\AccessingSecurityNotificationService'
  App\Accessing\ServiceInterface\Vendor\AccessingPhoneVerificationProviderServiceInterface: '@App\Accessing\Service\Vendor\AccessingPhoneVerificationGatewayService'
  App\Accessing\ServiceInterface\Verification\AccessingVerificationChallengeServiceInterface: '@App\Accessing\Service\Verification\AccessingVerificationChallengeService'
  App\Accessing\RepositoryInterface\AccountRepositoryInterface: '@App\Accessing\Repository\AccountRepository'
  App\Accessing\RepositoryInterface\AccountSessionRepositoryInterface: '@App\Accessing\Repository\AccountSessionRepository'
  App\Accessing\RepositoryInterface\SecurityEventRepositoryInterface: '@App\Accessing\Repository\SecurityEventRepository'
  App\Accessing\RepositoryInterface\VerificationChallengeRepositoryInterface: '@App\Accessing\Repository\VerificationChallengeRepository'

  App\Accessing\ServiceInterface\Admin\AccessingAccountAdministrationServiceInterface: '@App\Accessing\Service\Admin\DoctrineAccessingAccountAdministrationService'
  App\Accessing\ServiceInterface\Admin\AccessingAccountAdministrationProjectionProviderInterface: '@App\Accessing\Service\Admin\DoctrineAccessingAccountAdministrationProjectionProvider'
  App\Accessing\ServiceInterface\Admin\AccessingAccountAdministrationActionCatalogInterface: '@App\Accessing\Service\Admin\AccessingAccountAdministrationActionCatalog'
  App\Accessing\ServiceInterface\Admin\AccessingAccountAdministrationBridgeInterface: '@App\Accessing\Service\Admin\AccessingAccountAdministrationBridge'
  App\Accessing\ServiceInterface\Admin\AccessingAccountAdministrationAuditRecorderInterface: '@App\Accessing\Service\Admin\DoctrineAccessingAccountAdministrationAuditRecorder'
  App\Accessing\ServiceInterface\Admin\AccessingAccountAdministrationRequestValidatorInterface: '@App\Accessing\Service\Admin\AccessingAccountAdministrationRequestValidator'
  App\Accessing\ServiceInterface\Admin\AccessingAccountAdministrationAuditProjectionProviderInterface: '@App\Accessing\Service\Admin\DoctrineAccessingAccountAdministrationAuditProjectionProvider'

  App\Accessing\ServiceInterface\Admin\AccessingAccountAdministrationExecutionPlanProviderInterface: '@App\Accessing\Service\Admin\AccessingAccountAdministrationExecutionPlanProvider'
  App\Accessing\ServiceInterface\Admin\AccessingAccountAdministrationCapabilityMatrixProviderInterface: '@App\Accessing\Service\Admin\AccessingAccountAdministrationCapabilityMatrixProvider'
  App\Accessing\ServiceInterface\Admin\AccessingAccountAdministrationContractMatrixProviderInterface: '@App\Accessing\Service\Admin\AccessingAccountAdministrationContractMatrixProvider'
  App\Accessing\ServiceInterface\Admin\AccessingAccountAdministrationHealthReportProviderInterface: '@App\Accessing\Service\Admin\AccessingAccountAdministrationHealthReportProvider'
  App\Accessing\ServiceInterface\Admin\AccessingAccountAdministrationDiagnosticReportProviderInterface: '@App\Accessing\Service\Admin\AccessingAccountAdministrationDiagnosticReportProvider'

  App\Accessing\Service\Vendor\AccessingPhoneVerificationGatewayService:
    arguments:
      $providers: !tagged_iterator 'app.accessing.phone_provider'
      $selectedProvider: '%accessing.phone_verification_provider%'

  App\Accessing\Service\Vendor\AccessingFakePhoneVerificationProviderService:
    tags: ['app.accessing.phone_provider']

  App\Accessing\Service\Vendor\AccessingNullPhoneVerificationProviderService:
    tags: ['app.accessing.phone_provider']

  App\Accessing\ServiceInterface\Admin\AccessingAccountAdministrationReadinessReportProviderInterface: '@App\Accessing\Service\Admin\AccessingAccountAdministrationReadinessReportProvider'
  App\Accessing\ServiceInterface\Admin\AccessingAccountAdministrationExecutionReadinessProviderInterface: '@App\Accessing\Service\Admin\AccessingAccountAdministrationExecutionReadinessProvider'
  App\Accessing\ServiceInterface\Admin\AccessingAccountAdministrationRemediationPlanProviderInterface: '@App\Accessing\Service\Admin\AccessingAccountAdministrationRemediationPlanProvider'
  App\Accessing\ServiceInterface\Admin\AccessingAccountAdministrationWorkPlanProviderInterface: '@App\Accessing\Service\Admin\AccessingAccountAdministrationWorkPlanProvider'

  App\Accessing\Service\Config\AccessingEnvironmentConfigService:
    arguments:
      $projectDir: '%kernel.project_dir%'

when@dev:
  services:
    Doctrine\Bundle\FixturesBundle\Loader\SymfonyFixturesLoader: '@doctrine.fixtures.loader'
    App\Accessing\Command\AccessingDemoResetCommand:
      arguments:
        $fixturesLoader: '@doctrine.fixtures.loader'
