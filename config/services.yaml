parameters:
  accessing.product_name: 'Accessing'
  accessing.mailer_sender.default: 'no-reply@accessing.local'
  accessing.phone_verification_provider.default: 'fake'
  accessing.phone_verification_provider: '%env(default:accessing.phone_verification_provider.default:ACCESSING_PHONE_VERIFICATION_PROVIDER)%'

services:
  _defaults:
    autowire: true
    autoconfigure: true
    bind:
      $appSecret: '%env(APP_SECRET)%'
      $accessingSessionMaxIdleDays: 30
      $accessingVerificationCodeTtlMinutes: 15
      $accessingRecoveryCodeTtlMinutes: 30
      $accessingAccountLockThreshold: 5
      $accessingAccountLockMinutes: 15
      $accessingProductName: '%accessing.product_name%'
      $accessingMailerSender: '%env(default:accessing.mailer_sender.default:ACCESSING_MAILER_SENDER)%'
      Symfony\Component\RateLimiter\RateLimiterFactory $accessingSignInLimiter: '@limiter.accessing_sign_in'
      Symfony\Component\RateLimiter\RateLimiterFactory $accessingSignUpLimiter: '@limiter.accessing_sign_up'
      Symfony\Component\RateLimiter\RateLimiterFactory $accessingRecoveryLimiter: '@limiter.accessing_recovery'
      Symfony\Component\RateLimiter\RateLimiterFactory $accessingForgotPasswordLimiter: '@limiter.accessing_forgot_password'
      Symfony\Component\RateLimiter\RateLimiterFactory $accessingVerificationResendLimiter: '@limiter.accessing_verification_resend'

  App\Accessing\:
    resource: '../src/'
    exclude:
      - '../src/DependencyInjection/'
      - '../src/Entity/'
      - ../src/Dto/
      - ../src/ValueObject/
      - ../src/Value/
      - ../src/Contract/
      - ../src/Event/
      - ../src/Message/
      - ../src/Form/
      - '../src/Command/AccessDemoResetCommand.php'
      - '../src/Kernel.php'
      # Configuring integration is intentionally dormant in standalone Accessing.
      # The external App\Configuring contracts are not part of this component.
      - '../src/Provider/Configuration/'
      - '../src/Service/Config/'

  App\Accessing\ServiceInterface\AccountContext\AccessCurrentAccountContextProviderInterface: '@App\Accessing\Provider\AccountContext\AccessCurrentAccountContextProvider'
  App\Accessing\ServiceInterface\Account\AccessAccountAuthenticationServiceInterface: '@App\Accessing\Service\Account\AccessAccountAuthenticationService'
  App\Accessing\ServiceInterface\Account\AccessAccountRegistrationServiceInterface: '@App\Accessing\Service\Account\AccessAccountRegistrationService'
  App\Accessing\ServiceInterface\AccountSession\AccessAccountSessionServiceInterface: '@App\Accessing\Service\AccountSession\AccessAccountSessionService'
  App\Accessing\ServiceInterface\Credential\AccessCredentialServiceInterface: '@App\Accessing\Service\Credential\AccessCredentialService'
  App\Accessing\ServiceInterface\Recovery\AccessRecoveryServiceInterface: '@App\Accessing\Service\Recovery\AccessRecoveryService'
  App\Accessing\ServiceInterface\SecondFactor\AccessSecondFactorServiceInterface: '@App\Accessing\Service\SecondFactor\AccessSecondFactorService'
  App\Accessing\ServiceInterface\SecurityEvent\AccessSecurityEventRecorderInterface: '@App\Accessing\Recorder\SecurityEvent\AccessSecurityEventRecorder'
  App\Accessing\ServiceInterface\SecurityEvent\AccessSecurityEventServiceInterface: '@App\Accessing\Service\SecurityEvent\AccessSecurityEventService'
  App\Accessing\ServiceInterface\SecurityNotification\AccessSecurityNotificationServiceInterface: '@App\Accessing\Service\SecurityNotification\AccessSecurityNotificationService'
  App\Accessing\ServiceInterface\Vendor\AccessPhoneVerificationProviderServiceInterface: '@App\Accessing\Service\Vendor\AccessPhoneVerificationGatewayService'
  App\Accessing\ServiceInterface\Verification\AccessVerificationChallengeServiceInterface: '@App\Accessing\Service\Verification\AccessVerificationChallengeService'
  App\Accessing\RepositoryInterface\AccessAccountRepositoryInterface: '@App\Accessing\Repository\AccessAccountRepository'
  App\Accessing\RepositoryInterface\AccessAccountSessionRepositoryInterface: '@App\Accessing\Repository\AccessAccountSessionRepository'
  App\Accessing\RepositoryInterface\AccessSecurityEventRepositoryInterface: '@App\Accessing\Repository\AccessSecurityEventRepository'
  App\Accessing\RepositoryInterface\AccessVerificationChallengeRepositoryInterface: '@App\Accessing\Repository\AccessVerificationChallengeRepository'

  App\Accessing\ServiceInterface\Admin\AccessAccountAdministrationServiceInterface: '@App\Accessing\Service\Admin\AccessDoctrineAccessingAccountAdministrationService'
  App\Accessing\ServiceInterface\Admin\AccessAccountAdministrationProjectionProviderInterface: '@App\Accessing\Provider\Admin\AccessDoctrineAccessingAccountAdministrationProjectionProvider'
  App\Accessing\ServiceInterface\Admin\AccessAccountAdministrationActionCatalogInterface: '@App\Accessing\Catalog\Admin\AccessAccountAdministrationActionCatalog'
  App\Accessing\ServiceInterface\Admin\AccessAccountAdministrationBridgeInterface: '@App\Accessing\Bridge\Admin\AccessAccountAdministrationBridge'
  App\Accessing\ServiceInterface\Admin\AccessAccountAdministrationAuditRecorderInterface: '@App\Accessing\Recorder\Admin\AccessDoctrineAccessingAccountAdministrationAuditRecorder'
  App\Accessing\ServiceInterface\Admin\AccessAccountAdministrationRequestValidatorInterface: '@App\Accessing\Validator\Admin\AccessAccountAdministrationRequestValidator'
  App\Accessing\ServiceInterface\Admin\AccessAccountAdministrationAuditProjectionProviderInterface: '@App\Accessing\Provider\Admin\AccessDoctrineAccessingAccountAdministrationAuditProjectionProvider'

  App\Accessing\ServiceInterface\Admin\AccessAccountAdministrationExecutionPlanProviderInterface: '@App\Accessing\Provider\Admin\AccessAccountAdministrationExecutionPlanProvider'
  App\Accessing\ServiceInterface\Admin\AccessAccountAdministrationCapabilityMatrixProviderInterface: '@App\Accessing\Provider\Admin\AccessAccountAdministrationCapabilityMatrixProvider'
  App\Accessing\ServiceInterface\Admin\AccessAccountAdministrationContractMatrixProviderInterface: '@App\Accessing\Provider\Admin\AccessAccountAdministrationContractMatrixProvider'
  App\Accessing\ServiceInterface\Admin\AccessAccountAdministrationHealthReportProviderInterface: '@App\Accessing\Provider\Admin\AccessAccountAdministrationHealthReportProvider'
  App\Accessing\ServiceInterface\Admin\AccessAccountAdministrationDiagnosticReportProviderInterface: '@App\Accessing\Provider\Admin\AccessAccountAdministrationDiagnosticReportProvider'

  App\Accessing\Service\Vendor\AccessPhoneVerificationGatewayService:
    arguments:
      $providers: !tagged_iterator 'app.accessing.phone_provider'
      $selectedProvider: '%accessing.phone_verification_provider%'

  App\Accessing\Service\Vendor\AccessFakePhoneVerificationProviderService:
    tags: ['app.accessing.phone_provider']

  App\Accessing\Service\Vendor\AccessNullPhoneVerificationProviderService:
    tags: ['app.accessing.phone_provider']

  App\Accessing\ServiceInterface\Admin\AccessAccountAdministrationReadinessReportProviderInterface: '@App\Accessing\Provider\Admin\AccessAccountAdministrationReadinessReportProvider'
  App\Accessing\ServiceInterface\Admin\AccessAccountAdministrationExecutionReadinessProviderInterface: '@App\Accessing\Provider\Admin\AccessAccountAdministrationExecutionReadinessProvider'
  App\Accessing\ServiceInterface\Admin\AccessAccountAdministrationRemediationPlanProviderInterface: '@App\Accessing\Provider\Admin\AccessAccountAdministrationRemediationPlanProvider'
  App\Accessing\ServiceInterface\Admin\AccessAccountAdministrationWorkPlanProviderInterface: '@App\Accessing\Provider\Admin\AccessAccountAdministrationWorkPlanProvider'


  App\Accessing\Service\SecurityNotification\AccessSecurityNotificationService:
    arguments:
      $accessingMailerSender: '%env(default:accessing.mailer_sender.default:ACCESSING_MAILER_SENDER)%'

when@dev:
  services:
    Doctrine\Bundle\FixturesBundle\Loader\SymfonyFixturesLoader: '@doctrine.fixtures.loader'
    App\Accessing\Command\AccessDemoResetCommand:
      arguments:
        $fixturesLoader: '@doctrine.fixtures.loader'