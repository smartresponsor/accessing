doctrine:
  dbal:
    default_connection: data
    connections:
      data:
        url: '%env(resolve:DATABASE_URL)%'
        driver: pdo_pgsql
        server_version: '16'
      infra:
        driver: pdo_sqlite
        path: '%kernel.project_dir%/var/accessing_infra.sqlite'

  orm:
    default_entity_manager: data
    entity_managers:
      data:
        connection: data
        auto_mapping: false
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        mappings:
          Accessing:
            type: attribute
            is_bundle: false
            dir: '%kernel.project_dir%/src/Entity'
            prefix: 'App\Accessing\Entity'
            alias: Accessing
          ObjectingEmbeddable:
            type: attribute
            is_bundle: false
            dir: '%kernel.project_dir%/../Objecting/src/Embeddable'
            prefix: 'App\Objecting\Embeddable'
            alias: ObjectingEmbeddable
