security:
  password_hashers:
    Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

  providers:
    accessing_user_provider:
      entity:
        class: App\Accessing\Entity\AccessEntity
        property: email

  firewalls:
    dev:
      pattern: ^/(_(profiler|wdt)|css|images|js)/
      security: false

    main:
      lazy: true
      provider: accessing_user_provider
      entry_point: App\Accessing\Authenticator\AccessAuthenticationEntryPoint
      custom_authenticators:
        - App\Accessing\Authenticator\AccessProgrammaticAuthenticator

when@test:
  security:
    password_hashers:
      Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
        algorithm: auto
        cost: 4
        time_cost: 3
        memory_cost: 10
