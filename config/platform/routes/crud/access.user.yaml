# ---------------------------------------------------------------------------
# Cruding token grammar
# ---------------------------------------------------------------------------
# This file is a route-map registry/protocol file for the current Cruding parser.
#
# Current Cruding catch-all grammar:
#   API CRUD:
#     /api/{resourcePath}
#     /api/{resourcePath}/{slug}
#
#   Surface:
#     /{resource}/{subject}/{surface}
#     /{resource}/{subject}/{surface}/{action}
#     /{resource}/{subject}/{surface}/{item}/{action}
#     /{resource}/{subject}/{surface}/{token}/{item}
#     /{resource}/{subject}/{surface}/{token}/{item}/{action}
#
#   Classic CRUD:
#     /{resourcePath}/new/
#     /{resourcePath}/edit/{id}
#     /{resourcePath}/edit/{slug}
#     /{resourcePath}/delete/{id}
#     /{resourcePath}/delete/{slug}
#     /{resourcePath}/{id}
#     /{resourcePath}/{slug}
#     /{resourcePath}
#
# Token meaning:
#   resource      = first business/root token allowed by APP_RUNTIME_ENTITY
#   subject       = second business token
#   surface       = visual/object/surface token
#   token         = operation/surface token when grammar has 5+ segments
#   item          = item identifier value
#   action        = final operation token
#   resourcePath  = slash-aware classic CRUD resource path
#   id            = internal/admin/system identifier
#   slug          = public/outdoor/human identifier
#
# Runtime guard:
#   first URI token must be allowed by APP_RUNTIME_ENTITY.
#   reserved component roots must not be captured as business resources.
#
# Canon:
#   routeKey keeps full business chain, for example:
#     vendor.attachment.document.show
#   template target may stay short, for example:
#     document/show/index.html.twig
#   no {ref}; use {id}/{slug}; use semantic {productId}/{mediaId} for relations.
# ---------------------------------------------------------------------------

# config/platform/routes/crud/access.user.yaml
# Typical CRUD / CRUD-adjacent map.
# Item routes are explicit id/slug variants; no {ref}.

access.user.index:                     { path: /access/user/index,                        service: App\Accessing\Service\Http\Access\User\AccessUserIndexService }
access.user.show_id:                   { path: /access/user/show/{id},                    service: App\Accessing\Service\Http\Access\User\AccessUserShowService, resolver: id }
access.user.show_slug:                 { path: /access/user/show/{slug},                  service: App\Accessing\Service\Http\Access\User\AccessUserShowService, resolver: slug }
access.user.new:                       { path: /access/user/new,                          service: App\Accessing\Service\Http\Access\User\AccessUserNewService }
access.user.create:                    { path: /access/user/create,                       type: App\Accessing\Form\Access\User\AccessUserCreateType,                           service: App\Accessing\Service\Http\Access\User\AccessUserCreateService }
access.user.edit_id:                   { path: /access/user/edit/{id},                    service: App\Accessing\Service\Http\Access\User\AccessUserEditService, resolver: id }
access.user.edit_slug:                 { path: /access/user/edit/{slug},                  service: App\Accessing\Service\Http\Access\User\AccessUserEditService, resolver: slug }
access.user.update_id:                 { path: /access/user/update/{id},                  type: App\Accessing\Form\Access\User\AccessUserUpdateType,                           service: App\Accessing\Service\Http\Access\User\AccessUserUpdateService, resolver: id }
access.user.update_slug:               { path: /access/user/update/{slug},                type: App\Accessing\Form\Access\User\AccessUserUpdateType,                           service: App\Accessing\Service\Http\Access\User\AccessUserUpdateService, resolver: slug }
access.user.delete_id:                 { path: /access/user/delete/{id},                  type: App\Accessing\Form\Access\User\AccessUserDeleteType,                           service: App\Accessing\Service\Http\Access\User\AccessUserDeleteService, resolver: id }
access.user.delete_slug:               { path: /access/user/delete/{slug},                type: App\Accessing\Form\Access\User\AccessUserDeleteType,                           service: App\Accessing\Service\Http\Access\User\AccessUserDeleteService, resolver: slug }
access.user.bulk:                      { path: /access/user/bulk,                         type: App\Accessing\Form\Access\User\AccessUserBulkType,                             service: App\Accessing\Service\Http\Access\User\AccessUserBulkService }
access.user.import:                    { path: /access/user/import,                       type: App\Accessing\Form\Access\User\AccessUserImportType,                           service: App\Accessing\Service\Http\Access\User\AccessUserImportService }
access.user.export:                    { path: /access/user/export,                       type: App\Accessing\Form\Access\User\AccessUserExportType,                           service: App\Accessing\Service\Http\Access\User\AccessUserExportService }
access.user.archive_id:                { path: /access/user/archive/{id},                 type: App\Accessing\Form\Access\User\AccessUserArchiveType,                          service: App\Accessing\Service\Http\Access\User\AccessUserArchiveService, resolver: id }
access.user.archive_slug:              { path: /access/user/archive/{slug},               type: App\Accessing\Form\Access\User\AccessUserArchiveType,                          service: App\Accessing\Service\Http\Access\User\AccessUserArchiveService, resolver: slug }
access.user.restore_id:                { path: /access/user/restore/{id},                 type: App\Accessing\Form\Access\User\AccessUserRestoreType,                          service: App\Accessing\Service\Http\Access\User\AccessUserRestoreService, resolver: id }
access.user.restore_slug:              { path: /access/user/restore/{slug},               type: App\Accessing\Form\Access\User\AccessUserRestoreType,                          service: App\Accessing\Service\Http\Access\User\AccessUserRestoreService, resolver: slug }
access.user.duplicate_id:              { path: /access/user/duplicate/{id},               type: App\Accessing\Form\Access\User\AccessUserDuplicateType,                        service: App\Accessing\Service\Http\Access\User\AccessUserDuplicateService, resolver: id }
access.user.duplicate_slug:            { path: /access/user/duplicate/{slug},             type: App\Accessing\Form\Access\User\AccessUserDuplicateType,                        service: App\Accessing\Service\Http\Access\User\AccessUserDuplicateService, resolver: slug }
