parameters:
  accessing.recovery_code_ttl_minutes.default: 30
  accessing.recovery_code_ttl_minutes: '%env(int:default:accessing.recovery_code_ttl_minutes.default:ACCESSING_RECOVERY_CODE_TTL_MINUTES)%'
  accessing.verification_code_ttl_minutes.default: 10
  accessing.verification_code_ttl_minutes: '%env(int:default:accessing.verification_code_ttl_minutes.default:ACCESSING_VERIFICATION_CODE_TTL_MINUTES)%'
  accessing.session_max_idle_days.default: 30
  accessing.session_max_idle_days: '%env(int:default:accessing.session_max_idle_days.default:ACCESSING_SESSION_MAX_IDLE_DAYS)%'
  accessing.product_name: 'Accessing'
  accessing.mailer_sender: 'no-reply@example.test'
  accessing.phone_verification_provider.default: 'fake'
  accessing.phone_verification_provider: '%env(default:accessing.phone_verification_provider.default:ACCESSING_PHONE_VERIFICATION_PROVIDER)%'
  accessing.user_lock_threshold.default: 5
  accessing.user_lock_threshold: '%env(int:default:accessing.user_lock_threshold.default:ACCESSING_USER_LOCK_THRESHOLD)%'
  accessing.user_lock_minutes.default: 15
  accessing.user_lock_minutes: '%env(int:default:accessing.user_lock_minutes.default:ACCESSING_USER_LOCK_MINUTES)%'
  accessing.admin_password.default: ''
  accessing.admin_password: '%env(default:accessing.admin_password.default:ACCESSING_ADMIN_PASSWORD)%'

services:
  _defaults:
    autowire: true
    autoconfigure: true
    bind:
      string $appSecret: '%env(APP_SECRET)%'
      string $adminPassword: '%accessing.admin_password%'
      string $accessingProductName: '%accessing.product_name%'
      int $accessingRecoveryCodeTtlMinutes: '%accessing.recovery_code_ttl_minutes%'
      int $accessingVerificationCodeTtlMinutes: '%accessing.verification_code_ttl_minutes%'
      int $accessingSessionMaxIdleDays: '%accessing.session_max_idle_days%'
      int $accessingUserLockThreshold: '%accessing.user_lock_threshold%'
      int $accessingUserLockMinutes: '%accessing.user_lock_minutes%'
      int $accessingPasskeyChallengeTtlSeconds: 300
      int $accessingMobileAccessTtlSeconds: 900
      int $accessingMobileRefreshTtlSeconds: 2592000
      int $accessingMobilePendingAuthTtlSeconds: 600
      Symfony\Component\RateLimiter\RateLimiterFactory $accessingSignInLimiter: '@limiter.accessing_sign_in'
      Symfony\Component\RateLimiter\RateLimiterFactory $accessingSignUpLimiter: '@limiter.accessing_sign_up'
      Symfony\Component\RateLimiter\RateLimiterFactory $accessingSecondFactorLimiter: '@limiter.accessing_second_factor'
      Symfony\Component\RateLimiter\RateLimiterFactory $accessingRecoveryLimiter: '@limiter.accessing_recovery'
      Symfony\Component\RateLimiter\RateLimiterFactory $accessingVerificationResendLimiter: '@limiter.accessing_verification_resend'
      Symfony\Component\RateLimiter\RateLimiterFactory $accessingForgotPasswordLimiter: '@limiter.accessing_forgot_password'

  # Symfony-native component export surface.
  # The host application may import this file from the component root.
  App\Accessing\:
    resource: '../../src/'
    exclude:
      - '../../src/Kernel.php'
      - '../../src/Recorder/SecurityEvent/AccessSecurityEventRecorder.php'
      - '../../src/ServiceInterface/SecurityEvent/AccessSecurityEventRecorderInterface.php'
      - '../../src/DependencyInjection/'
      - '../../src/Entity/'
      - ../../src/Dto/
      - ../../src/ValueObject/
      - ../../src/Value/
      - ../../src/Contract/
      - ../../src/Event/
      - ../../src/Message/
      - '../../src/Tests/'
      # Configuring integration is intentionally dormant in standalone Accessing.
      # The external App\Configuring contracts are not part of this component.
      - ../../src/Provider/Configuration/
      - ../../src/Service/Config/


  Psr\Clock\ClockInterface: '@App\Accessing\Service\Clock\AccessSystemClock'
  App\Accessing\ServiceInterface\Context\AccessCurrentContextProviderInterface: '@App\Accessing\Provider\Context\AccessCurrentContextProvider'
  App\Accessing\ServiceInterface\Access\AccessAuthenticationServiceInterface: '@App\Accessing\Service\Access\AccessAuthenticationService'
  App\Accessing\ServiceInterface\Access\AccessRegistrationServiceInterface: '@App\Accessing\Service\Access\AccessRegistrationService'
  App\Accessing\ServiceInterface\Session\AccessSessionServiceInterface: '@App\Accessing\Service\Session\AccessSessionService'
  App\Accessing\ServiceInterface\Credential\AccessCredentialServiceInterface: '@App\Accessing\Service\Credential\AccessCredentialService'
  App\Accessing\ServiceInterface\Recovery\AccessRecoveryServiceInterface: '@App\Accessing\Service\Recovery\AccessRecoveryService'
  App\Accessing\ServiceInterface\SecondFactor\AccessSecondFactorServiceInterface: '@App\Accessing\Service\SecondFactor\AccessSecondFactorService'
  App\Accessing\ServiceInterface\SecurityEvent\AccessSecurityEventServiceInterface: '@App\Accessing\Service\SecurityEvent\AccessSecurityEventService'
  App\Accessing\ServiceInterface\SecurityNotification\AccessSecurityNotificationServiceInterface: '@App\Accessing\Service\SecurityNotification\AccessSecurityNotificationService'
  App\Accessing\ServiceInterface\Vendor\AccessPhoneVerificationProviderServiceInterface: '@App\Accessing\Service\Vendor\AccessPhoneVerificationGatewayService'
  App\Accessing\ServiceInterface\Verification\AccessVerificationChallengeServiceInterface: '@App\Accessing\Service\Verification\AccessVerificationChallengeService'
  App\Accessing\ServiceInterface\Password\AccessCompromisedPasswordProviderInterface: '@App\Accessing\Service\Password\AccessSymfonyCompromisedPasswordProvider'
  App\Accessing\ServiceInterface\Passkey\AccessPasskeyCredentialServiceInterface: '@App\Accessing\Service\Passkey\AccessPasskeyCredentialService'
  App\Accessing\ServiceInterface\Passkey\AccessPasskeyChallengeServiceInterface: '@App\Accessing\Service\Passkey\AccessPasskeyChallengeService'
  App\Accessing\ServiceInterface\Passkey\AccessPasskeyRegistrationServiceInterface: '@App\Accessing\Service\Passkey\AccessPasskeyRegistrationService'
  App\Accessing\ServiceInterface\Passkey\AccessPasskeyAuthenticationServiceInterface: '@App\Accessing\Service\Passkey\AccessPasskeyAuthenticationService'
  App\Accessing\ServiceInterface\Passkey\AccessPasskeyAttestationVerifierInterface: '@App\Accessing\Service\Passkey\AccessWebauthnAttestationVerifier'
  App\Accessing\ServiceInterface\Passkey\AccessPasskeyAssertionVerifierInterface: '@App\Accessing\Service\Passkey\AccessWebauthnAssertionVerifier'
  App\Accessing\ServiceInterface\Mobile\AccessMobileTokenServiceInterface: '@App\Accessing\Service\Mobile\AccessMobileTokenService'
  App\Accessing\ServiceInterface\Mobile\AccessMobilePendingAuthServiceInterface: '@App\Accessing\Service\Mobile\AccessMobilePendingAuthService'
  App\Accessing\RepositoryInterface\AccessPasskeyChallengeRepositoryInterface: '@App\Accessing\Repository\AccessPasskeyChallengeRepository'
  App\Accessing\RepositoryInterface\AccessPasskeyCredentialRepositoryInterface: '@App\Accessing\Repository\AccessPasskeyCredentialRepository'
  App\Accessing\RepositoryInterface\AccessMobileSessionRepositoryInterface: '@App\Accessing\Repository\AccessMobileSessionRepository'
  App\Accessing\RepositoryInterface\AccessMobilePendingAuthRepositoryInterface: '@App\Accessing\Repository\AccessMobilePendingAuthRepository'
  App\Accessing\RepositoryInterface\AccessRepositoryInterface: '@App\Accessing\Repository\AccessRepository'
  App\Accessing\RepositoryInterface\AccessSessionRepositoryInterface: '@App\Accessing\Repository\AccessSessionRepository'
  App\Accessing\RepositoryInterface\AccessSecurityEventRepositoryInterface: '@App\Accessing\Repository\AccessSecurityEventRepository'
  App\Accessing\RepositoryInterface\AccessVerificationChallengeRepositoryInterface: '@App\Accessing\Repository\AccessVerificationChallengeRepository'

  App\Accessing\ServiceInterface\Rendering\AccessPageResponderInterface: '@App\Accessing\Responder\Rendering\AccessTwigPageResponder'
  App\Accessing\ServiceInterface\Rendering\AccessPageViewFactoryInterface: '@App\Accessing\Factory\Rendering\AccessPageViewFactory'

  App\Accessing\Service\Http\Access\AccessIndexService:
    public: true
    tags: ['controller.service_arguments']
  App\Accessing\Service\Http\Access\AccessSecurityFlowService:
    public: true
    tags: ['controller.service_arguments']
  App\Accessing\Service\Http\Access\AccessSurfaceFlowService:
    public: true
    tags: ['controller.service_arguments']
  App\Accessing\Service\Http\Access\AccessResetPasswordFlowService:
    public: true
    tags: ['controller.service_arguments']

  App\Accessing\Service\Vendor\AccessPhoneVerificationGatewayService:
    arguments:
      $providers: !tagged_iterator 'app.accessing.phone_provider'
      $selectedProvider: '%accessing.phone_verification_provider%'

  App\Accessing\Service\Vendor\AccessFakePhoneVerificationProviderService:
    tags: ['app.accessing.phone_provider']

  App\Accessing\Service\Vendor\AccessNullPhoneVerificationProviderService:
    tags: ['app.accessing.phone_provider']

  App\Accessing\Service\SecurityNotification\AccessSecurityNotificationService:
    arguments:
      $accessingMailerSender: '%accessing.mailer_sender%'
