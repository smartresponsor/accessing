component:
  schema_version: 1
  name: accessing
  title: Accessing
  package: accessing/access
  status: rc
  namespace: App
  responsibility: "access and identity-facing application surfaces"
  export_contract:
    services: config/component/services.yaml
    routes: config/component/routes.yaml
    api_platform: config/component/api_platform.yaml
    doctrine: config/component/doctrine.yaml
    messenger: config/component/messenger.yaml
    security: config/component/security.yaml
    env: config/component/env.yaml
    smoke: config/component/smoke.yaml
  host_policy:
    business_logic_owner: component
    composition_owner: host_application
    glue_layer_goal: near_zero
    transport_contracts: dto_api_resource_first
    entities_as_transport_contracts: false

  symfony_bundle:
    class: App\Accessing\AccessingBundle
    extension: App\Accessing\DependencyInjection\AccessingExtension
    services_loaded_by_extension: config/component/services.yaml
    routes_import_required_by_host: config/component/routes.yaml

# Accessing owns its integration contract here.
# Administering reads this via AccessConfigurationToolProvider::integrationContract().
# The stub in Administering/src/Contract/Accessing/ is now replaced by a real adapter.
# This is the single source of truth — do not duplicate in Administering's component.yaml.
integration:
  owns: authentication_session_identity

  # Subject identity — used by Rolling to build ACL subject strings
  subject_prefix: 'accessing:user:'

  # User administration services (interface FQCNs)
  # Administering uses these to wire the admin bridge without hardcoding them.
  administration_service: App\Accessing\ServiceInterface\Admin\AccessUserAdministrationServiceInterface
  administration_projection_provider: App\Accessing\ServiceInterface\Admin\AccessUserAdministrationProjectionProviderInterface
  administration_action_catalog: App\Accessing\ServiceInterface\Admin\AccessUserAdministrationActionCatalogInterface
  administration_bridge: App\Accessing\ServiceInterface\Admin\AccessUserAdministrationBridgeInterface
  administration_request_validator: App\Accessing\ServiceInterface\Admin\AccessUserAdministrationRequestValidatorInterface
  administration_audit_recorder: App\Accessing\ServiceInterface\Admin\AccessUserAdministrationAuditRecorderInterface
  administration_audit_projection_provider: App\Accessing\ServiceInterface\Admin\AccessUserAdministrationAuditProjectionProviderInterface

  # Readiness and diagnostics surface services
  administration_readiness_report_provider: App\Accessing\ServiceInterface\Admin\AccessUserAdministrationReadinessReportProviderInterface
  administration_execution_readiness_provider: App\Accessing\ServiceInterface\Admin\AccessUserAdministrationExecutionReadinessProviderInterface
  administration_remediation_plan_provider: App\Accessing\ServiceInterface\Admin\AccessUserAdministrationRemediationPlanProviderInterface
  administration_work_plan_provider: App\Accessing\ServiceInterface\Admin\AccessUserAdministrationWorkPlanProviderInterface
  administration_execution_plan_provider: App\Accessing\ServiceInterface\Admin\AccessUserAdministrationExecutionPlanProviderInterface
  administration_capability_matrix_provider: App\Accessing\ServiceInterface\Admin\AccessUserAdministrationCapabilityMatrixProviderInterface
  administration_contract_matrix_provider: App\Accessing\ServiceInterface\Admin\AccessUserAdministrationContractMatrixProviderInterface
  administration_health_report_provider: App\Accessing\ServiceInterface\Admin\AccessUserAdministrationHealthReportProviderInterface
  administration_diagnostic_report_provider: App\Accessing\ServiceInterface\Admin\AccessUserAdministrationDiagnosticReportProviderInterface
